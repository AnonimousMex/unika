<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Limelight&family=Source+Sans+3:wght@400;500;600;700&family=Josefin+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: barra de pestañas tipo menú impreso (negro y oro), cada pestaña es una pantalla del sistema */
:root{
  --ink:#0e0b08; --panel:#18130e; --panel2:#211a12; --line:#3b2f20;
  --gold:#d6a54e; --gold2:#f2d18e; --ember:#c9562c; --cream:#f0e7d5; --muted:#a8977d;
  --ok:#74c27a; --warn:#e8b04a; --bad:#e2674b;
  --f-display:"Federo","Copperplate","Didot",serif;
  --f-body:"Josefin Sans","Avenir Next","Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ink);color:var(--cream);font-family:var(--f-body);font-size:15px;line-height:1.4;
  background-image:radial-gradient(1200px 400px at 50% -200px,rgba(201,86,44,.28),transparent 70%);}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}
header{padding-block:18px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-size:44px;letter-spacing:.18em;line-height:1;
  background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,#8a5d22);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);padding-bottom:6px}
.demo{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);padding-bottom:6px}
.switch{width:44px;height:24px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);position:relative}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:.2s}
.switch[aria-pressed="true"]{background:#3a2a12;border-color:var(--gold)}
.switch[aria-pressed="true"]::after{left:23px;background:var(--gold2)}
nav{display:flex;gap:4px;overflow-x:auto;margin-top:14px;scrollbar-width:none}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;white-space:nowrap;
  font-family:var(--f-display);letter-spacing:.12em;text-transform:uppercase;font-size:13px;color:var(--muted)}
nav button[aria-selected="true"]{color:var(--gold2);border-color:var(--gold)}
nav .n{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--ember);color:#fff;font-family:var(--f-body);font-size:11px;margin-left:6px}
main{padding-block:20px 40px}
h2{font-family:var(--f-display);font-weight:400;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);font-size:20px;margin:0 0 4px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 18px;max-width:70ch}
h3{font-family:var(--f-display);font-weight:400;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-size:14px;margin:0 0 10px;display:flex;align-items:center;gap:10px}
h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.tnum{font-variant-numeric:tabular-nums}
.btn{background:var(--gold);color:#1a1208;border:0;border-radius:4px;padding:10px 16px;font-weight:700;letter-spacing:.04em}
.btn:hover{background:var(--gold2)}
.btn.ghost{background:transparent;color:var(--gold2);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--gold)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:#2f4d31}.pill.warn{color:var(--warn);border-color:#5a4520}.pill.bad{color:var(--bad);border-color:#5b2a1f}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}

/* MESERO */
.pos{display:grid;grid-template-columns:200px minmax(0,1fr) 330px;gap:16px;align-items:start}
.mesas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mesa{aspect-ratio:1;max-width:100%;border:1px solid var(--line);background:var(--panel2);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.mesa b{font-family:var(--f-display);font-size:20px;font-weight:400}
.mesa small{font-size:10px;color:var(--muted);letter-spacing:.05em}
.mesa.busy{border-color:#6b4a1d}.mesa.busy small{color:var(--warn)}
.mesa.res small{color:#9fb6e0}
.mesa[aria-pressed="true"]{background:var(--gold);color:#1a1208;border-color:var(--gold2)}
.mesa[aria-pressed="true"] small{color:#3b2a10}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.cat{background:none;border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:13px;color:var(--muted)}
.cat[aria-pressed="true"]{border-color:var(--gold);color:var(--gold2);background:#2a1f12}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.item{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:6px;min-height:84px}
.item:hover{border-color:var(--gold)}
.item .nm{font-weight:600}
.item .pr{color:var(--gold2);margin-top:auto}
.item .tag{font-size:11px;color:var(--muted)}
.catnote{font-size:13px;color:var(--muted);margin:-4px 0 12px}
.tiempos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.tiempos button{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:8px 4px;font-size:12px;color:var(--muted)}
.tiempos button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold2)}
.tgroup{margin-bottom:10px}
.tgroup h4{margin:0 0 4px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ember)}
.line{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.line .q{color:var(--gold2);font-weight:700}
.line .x{background:none;border:0;color:var(--muted);font-size:16px;padding:0 4px}
.line small{display:block;color:var(--muted);font-size:12px}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0;font-size:18px}
.total b{font-family:var(--f-display);color:var(--gold2);font-size:24px;font-weight:400}
.empty{color:var(--muted);font-size:14px;padding:14px 0}

/* COCINA */
.kds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.col h3 .c{color:var(--cream);font-family:var(--f-body)}
.tk{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:4px;padding:12px;margin-bottom:10px}
.tk.cola{border-left-color:var(--warn)}.tk.prep{border-left-color:var(--ember)}.tk.listo{border-left-color:var(--ok)}
.tk.late{box-shadow:0 0 0 1px var(--bad)}
.tk header{all:unset;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.tk .m{font-family:var(--f-display);font-size:18px;color:var(--gold2)}
.tk .tt{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--ember)}
.tk ul{list-style:none;margin:0 0 10px;padding:0;font-size:14px}
.tk li{padding:2px 0}.tk li b{color:var(--gold2)}
.tk li em{font-style:normal;color:var(--muted);font-size:12px}
.tk .ft{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.tk .btn{padding:6px 10px;font-size:12px}

/* PANTALLA */
.tv{background:#050403;border:10px solid #1d1812;border-radius:14px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.tvtop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.tvtop .logo{font-size:30px}
.clock{font-family:var(--f-display);font-size:26px;color:var(--gold2)}
.tvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tvc{border:1px solid var(--line);border-radius:6px;padding:14px;background:linear-gradient(180deg,#15100b,#0b0806)}
.tvc .mm{display:flex;justify-content:space-between;align-items:baseline}
.tvc .mm b{font-family:var(--f-display);font-size:28px;font-weight:400;color:var(--gold2)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:12px 0 8px}
.steps span{height:6px;border-radius:3px;background:#2a2219}
.steps span.on{background:var(--gold)}
.steps span.now{background:var(--ember);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.45}}
.tvc .st{font-size:20px}
.tvc .st.listo{color:var(--ok)}
.tvc .q{color:var(--muted);font-size:13px;margin-top:4px}
.ticker{margin-top:18px;border-top:1px solid var(--line);padding-top:12px;color:var(--muted);font-size:14px;display:flex;gap:16px;flex-wrap:wrap}
.ticker b{color:var(--bad)}

/* RESERVAS */
.resv{display:grid;grid-template-columns:340px minmax(0,1fr);gap:24px;align-items:start}
.phone{width:100%;max-width:340px;border:10px solid #221b13;border-radius:34px;background:#120e0a;padding:20px 16px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.phone .logo{font-size:28px;text-align:center;display:block}
.phone .sub{text-align:center;padding:0 0 14px;font-size:10px}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-size:12px;color:var(--muted);letter-spacing:.05em}
.f input,.f select{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:9px 10px;font-size:14px;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.days{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.days button{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:8px;font-size:13px}
.days button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold2)}
.apartar{border:1px dashed #6b4a1d;border-radius:6px;padding:10px;margin-bottom:12px;background:#1a130b}
.apartar p{margin:0 0 8px;font-size:12px;color:var(--gold2)}
.phone .btn{width:100%}
.ok-msg{color:var(--ok);font-size:13px;text-align:center;margin-top:8px;min-height:18px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);padding:8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid #2a2117}
.scroll{overflow-x:auto}
.stats{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:14px}
.stats div{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.stats b{display:block;font-family:var(--f-display);font-size:26px;font-weight:400;color:var(--gold2);letter-spacing:0}

/* CARNE */
.meat{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mt{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px}
.mt .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.mt .hd b{font-size:16px}
.bar{height:10px;border-radius:5px;background:#2a2219;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .v{background:#7a5a2c}.bar .a{background:#5d79a8}.bar .d{background:var(--gold)}
.mt .nums{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:8px}
.mt .nums b{color:var(--cream)}
.mt .acts{display:flex;gap:6px;margin-top:10px}
.mt .acts .btn{padding:5px 10px;font-size:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:14px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:8px;border-radius:2px;display:inline-block}

/* EXTRAS */
.offers{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.of{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px}
.of .k{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ember)}
.of h4{font-family:var(--f-display);font-weight:400;font-size:18px;color:var(--gold2);margin:6px 0 8px;letter-spacing:.06em}
.of p{margin:0;color:var(--muted);font-size:14px}
.split{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;margin-top:20px}
.hb{display:grid;grid-template-columns:110px minmax(0,1fr) 48px;gap:10px;align-items:center;font-size:13px;margin-bottom:8px}
.hb .t{height:14px;background:linear-gradient(90deg,#8a5d22,var(--gold));border-radius:2px}
.hours{display:flex;align-items:flex-end;gap:6px;height:130px;border-bottom:1px solid var(--line);padding-top:10px}
.hours div{flex:1;background:linear-gradient(180deg,var(--gold),#6b4a1d);border-radius:2px 2px 0 0;position:relative}
.hours div.pk{background:linear-gradient(180deg,var(--ember),#6b2f17)}
.hl{display:flex;gap:6px;font-size:11px;color:var(--muted);margin-top:4px}.hl span{flex:1;text-align:center}
.note{font-size:12px;color:var(--muted);margin-top:10px}

/* modal carne */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.dlg{background:var(--panel);border:1px solid var(--gold);border-radius:8px;padding:20px;width:100%;max-width:420px}
.dlg h3{margin-bottom:4px}
.dlg p{color:var(--muted);font-size:13px;margin:0 0 12px}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:10px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:6px}
.chip:hover:not(:disabled){border-color:var(--gold)}
.chip:disabled{opacity:.35;text-decoration:line-through}
.chip small{font-size:11px;color:var(--muted)}
.chip small.low{color:var(--warn)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gold2);color:#1a1208;padding:10px 18px;border-radius:4px;font-weight:700;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.5)}

@media (max-width:1000px){
  .pos{grid-template-columns:1fr}
  .mesas{grid-template-columns:repeat(6,1fr)}
  .kds{grid-template-columns:repeat(2,minmax(0,1fr))}
  .resv,.split{grid-template-columns:1fr}
  .phone{margin:0 auto}
}
@media (max-width:560px){
  .mesas{grid-template-columns:repeat(4,1fr)}
  .kds{grid-template-columns:1fr}
  .logo{font-size:34px}
  .demo{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

   ["En la mesa","Menú con QR y pedido desde el celular","El cliente escanea el QR de su mesa, ve el menú con fotos y pide. El pedido cae directo a la cocina con su número de mesa."],
   ["Para llevar","Pedidos por WhatsApp","Un enlace en WhatsApp e Instagram para pedir para llevar. La orden entra a la misma fila de cocina con la hora de recogida."],
   ["Clientes","Tarjeta de lealtad digital","Por cada 10 tacos, uno gratis. Se registra con su número de WhatsApp, sin tarjetas de papel."],
   ["Caja","Cuenta dividida y pago en mesa","El mesero divide la cuenta por persona y cobra con terminal o transferencia desde la misma comanda."],
   ["Dueño","Reporte diario en el celular","Ventas del día, platillos más vendidos, horas pico y cuánta carne pedir para mañana."],
   ["Compras","Pedido de carne sugerido","Con las ventas y las reservas de cada fin de semana, el sistema sugiere cuántos kilos pedir al proveedor."],
  ];
  return `<h2>Qué más le podemos ofrecer</h2><p class="lead">Módulos que se pueden sumar al sistema de comandas. Los números de abajo son de ejemplo para mostrar cómo se vería el reporte.</p>
  <div class="offers">${offs.map(o=>`<div class="of"><div class="k">${o[0]}</div><h4>${o[1]}</h4><p>${o[2]}</p></div>`).join("")}</div>
  <div class="split">
    <div class="box"><h3>Más vendido hoy (ejemplo)</h3>${top.map(([n,v])=>`<div class="hb"><span>${n}</span><span class="t" style="width:${v/mx*100}%"></span><span class="tnum" style="text-align:right">${v}</span></div>`).join("")}</div>
    <div class="box"><h3>Órdenes por hora (ejemplo)</h3><div class="hours">${hrs.map(([h,v])=>`<div class="${v>=60?"pk":""}" style="height:${v/hmx*100}%" title="${v} órdenes"></div>`).join("")}</div>
    <div class="hl">${hrs.map(([h])=>`<span>${h}pm</span>`).join("")}</div><p class="note">Hora pico entre 8 y 9 pm: conviene tener más carne marinada lista desde las 7.</p></div>
  </div>`;
}

// ===== RENDER =====
function render(){
  renderTabs();
  $("#app").innerHTML={mesero:vMesero,cocina:vCocina,pantalla:vPantalla,reservas:vReservas,carne:vCarne,extras:vExtras}[S.tab]();
  tick();
}
function tick(){const c=$("#clock");if(c)c.textContent=new Date().toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"})}

document.addEventListener("click",e=>{
  const b=e.target.closest("button,[data-close]");if(!b)return;const d=b.dataset;
  if(d.tab)return go(d.tab);
  if(d.mesa){S.mesa=+d.mesa;return render()}
  if(d.cat){S.query="";S.cat=d.cat;S.tiempo=MENU.find(x=>x.c===d.cat).t;return render()}
  if(d.t){S.tiempo=+d.t;return render()}
  if(d.add){const it=MENU.flatMap(g=>g.i).find(i=>i[0]===d.add);if(it[2]==="C"||it[2]==="P")return pickMeat(it[0],it[2]);return addItem(it[0],it[2]||"")}
  if(d.meat){$("#layer").innerHTML="";return addItem(d.for,d.meat)}
  if(d.close&&(e.target===b)){$("#layer").innerHTML="";return}
  if(d.del){S.cart.splice(+d.del,1);return render()}
  if(b.id==="send")return send();
  if(d.adv)return advance(+d.adv);
  if(d.day){S.day=d.day;return render()}
  if(d.recv){S.meat[d.recv].d+=10;toast(`+10 porciones de ${d.recv}`);return render()}
  if(d.out){S.meat[d.out].d=0;toast(`${d.out} marcado como agotado`);return render()}
  if(b.id==="demo"){S.demo=!S.demo;b.setAttribute("aria-pressed",S.demo);return}
});
document.addEventListener("input",e=>{if(e.target.id!=="menu-search")return;const pos=e.target.selectionStart;S.query=e.target.value;render();const input=$("#menu-search");input.focus();try{input.setSelectionRange(pos,pos)}catch{}});
document.addEventListener("submit",e=>{if(e.target.id==="rf")reserve(e)});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#layer").innerHTML=""});

// Demo: la cocina avanza sola cada 7 s para que se vea moverse la pantalla
setInterval(()=>{
  if(!S.demo||$("#layer").innerHTML||S.tab==="reservas")return;
  const o=S.orders.filter(x=>["cola","prep","listo"].includes(x.st)).sort((a,b)=>a.ts-b.ts)[0];
  if(o)advance(o.id);
},7000);
setInterval(tick,15000);

const h=(location.hash||"").slice(1);if(TABS.some(t=>t[0]===h))S.tab=h;
render();
</script>

</body>
</html>
